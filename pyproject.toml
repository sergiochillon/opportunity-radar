[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-radar"
version = "1.0.0"
description = "Personal automated monitor for freelance and technical opportunities."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Opportunity Radar Maintainer" }
]
dependencies = [
    "pydantic>=2.7.0",
    "google-genai>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
